<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nanny Report</title>
  {% include "_theme.html" %}
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--cream);
      color: var(--brown-deep);
      min-height: 100vh;
      padding: 24px 16px 48px;
      max-width: 680px;
      margin: 0 auto;
    }
    .header { text-align: center; margin-bottom: 20px; }
    h1 {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 1.65rem; font-weight: normal;
      color: var(--brown-mid); letter-spacing: -0.01em; margin-bottom: 4px;
    }
    .back { font-size: .82rem; color: var(--text-muted); text-decoration: none; }
    .back:hover { color: var(--brown-mid); }
    .datebar { display: flex; justify-content: center; margin: 14px 0 20px; }
    select {
      min-height: var(--tap);
      font: inherit; padding: 8px 14px; border-radius: 12px;
      border: 1px solid var(--brown-muted); background: var(--surface);
      color: var(--brown-deep);
    }
    .card {
      background: var(--surface); border-radius: var(--r);
      box-shadow: var(--shadow-card); padding: 18px; margin-bottom: 14px;
    }
    .card h2 {
      font-size: .82rem; text-transform: uppercase; letter-spacing: .06em;
      color: var(--text-muted); font-weight: 600; margin-bottom: 10px;
    }
    .narrative { line-height: 1.55; font-size: .95rem; }
    .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
    /* An odd number of tiles would leave a half-width orphan on the last row. */
    .tiles > .tile:last-child:nth-child(odd) { grid-column: 1 / -1; }
    .tile {
      background: var(--surface); border-radius: var(--r);
      box-shadow: var(--shadow-card); padding: 14px; text-align: center;
    }
    .tile .num { font-size: 1.6rem; font-weight: 600; color: var(--brown-mid); }
    .tile .lbl { font-size: .72rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: .05em; margin-top: 2px; }
    .tile.warn { background: var(--danger-a); }
    .tile.warn .num { color: var(--danger); }
    .phone-event { border-left: 3px solid var(--flag); padding: 8px 12px; margin-bottom: 12px; background: var(--flag-a); border-radius: 0 10px 10px 0; }
    .phone-event.flagged { border-left-color: var(--danger); background: var(--danger-a); }
    .rule { font-size: .78rem; color: var(--text-muted); line-height: 1.45; margin-bottom: 10px; }
    .kv-row { display: flex; justify-content: space-between; gap: 12px; font-size: .88rem; padding: 4px 0; }
    .kv-val { color: var(--text-muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
    .card.alert { background: var(--danger-a); }
    .card.alert h2 { color: var(--danger); }
    .verdict { border-left: 5px solid var(--brown-mid); }
    .verdict .line { font-size: var(--t-2xl); font-weight: 600; line-height: 1.15; }
    .verdict .why { font-size: .82rem; color: var(--text-muted); margin-top: 6px; line-height: 1.5; }
    .verdict.concern   { border-left-color: var(--danger); background: var(--danger-a); }
    .verdict.concern .line { color: var(--danger); }
    .verdict.attention { border-left-color: var(--flag); background: var(--flag-a); }
    .verdict.degraded  { border-left-color: var(--text-muted); }
    .verdict.clear     { border-left-color: var(--sleep); }
    .model-tag {
      display: inline-block; font-size: .62rem; letter-spacing: .06em; text-transform: uppercase;
      color: var(--text-muted); border: 1px solid var(--cream-2); border-radius: 999px;
      padding: 1px 7px; margin-left: 8px; vertical-align: middle;
    }
    .trend { display: flex; gap: 3px; align-items: flex-end; height: 74px; margin: 6px 0 4px; }
    /* These are <button> now, so strip the UA chrome. The full column height is the
       hit area — the bar itself can be 3px, and the column ~7.5px on a 360px screen. */
    .trend .day {
      flex: 1; display: flex; flex-direction: column; justify-content: flex-end;
      height: 100%; background: none; border: 0; padding: 0; cursor: pointer;
    }
    .trend .day:focus-visible { outline: 2px solid var(--sleep); outline-offset: 1px; }
    .trend .bar { border-radius: 3px 3px 0 0; background: var(--sleep); min-height: 3px; }
    .trend .day.attention .bar { background: var(--flag); }
    .trend .day.concern .bar   { background: var(--danger); }
    /* A day nobody watched must not read as a clean day. */
    .trend .day.thin .bar { opacity: .35; background: repeating-linear-gradient(
      45deg, var(--text-muted), var(--text-muted) 2px, transparent 2px, transparent 4px); }
    .trend .tick { font-size: var(--t-xs); color: var(--text-muted); text-align: center; margin-top: 3px; }
    .phone-event .when { font-weight: 600; font-size: .9rem; }
    .phone-event .desc { font-size: .85rem; color: var(--text-muted); margin: 3px 0; }
    /* _theme.html already defines .badge / .danger / .nap, and it makes the danger
       badge solid on purpose ("must not look like the four pieces of metadata beside
       it"). This page used to redefine all three and quietly undo that, rendering
       "⚠️ not allowed" as a 10%-alpha tint identical in weight to the room name.
       Only the page-specific spacing belongs here. */
    .when .badge { margin-left: 6px; }
    video { width: 100%; border-radius: 10px; margin-top: 8px; background: #000; }
    .speeds { display: flex; gap: 6px; margin-top: 6px; }
    .speed {
      flex: 1; min-height: var(--tap); font: inherit; font-size: .78rem;
      background: var(--cream-2); color: var(--brown-mid); border: 1px solid transparent;
      border-radius: 8px; cursor: pointer; padding: 6px 0;
      font-variant-numeric: tabular-nums;
    }
    .speed.on { background: var(--brown-mid); color: var(--surface); font-weight: 600; }
    .hour-group { margin-bottom: 14px; }
    .hour-label { font-size: .78rem; color: var(--text-muted); font-weight: 600; margin-bottom: 6px; }
    .tl-row { display: flex; gap: 10px; font-size: .88rem; padding: 4px 0; }
    .tl-time { color: var(--text-muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
    .tl-cam { color: var(--text-muted); font-size: .75rem; white-space: nowrap; padding-top: 1px; }
    .nap-band {
      background: var(--sleep-a); border-radius: 8px; padding: 5px 10px;
      font-size: .82rem; color: var(--sleep); margin: 6px 0;
    }
    /* <details> used as a card: the summary has to look like the h2 it replaces. */
    .h2-summary {
      font-size: .82rem; text-transform: uppercase; letter-spacing: .06em;
      color: var(--text-muted); font-weight: 600; cursor: pointer;
      min-height: var(--tap); display: flex; align-items: center; list-style: none;
    }
    .h2-summary::-webkit-details-marker { display: none; }
    .h2-summary::after { content: " ▾"; margin-left: 6px; }
    details[open] > .h2-summary::after { content: " ▴"; }
    /* Touch has no hover, so tapping a trend bar reports here instead. */
    /* Fixed, and toggled by opacity: this used to be a sticky in-flow div that was
       display:none until tapped, so revealing it inserted ~40px at the top of the
       document and shifted the whole page under the finger that had just tapped. */
    .touch-note {
      position: fixed; top: 8px; left: 16px; right: 16px; z-index: 20;
      text-align: center; background: var(--toast-bg); color: var(--toast-fg);
      padding: 8px 14px; border-radius: 12px; font-size: .8rem;
      opacity: 0; visibility: hidden; transition: opacity .15s;
    }
    .touch-note.show { opacity: 1; visibility: visible; }
    @media (prefers-reduced-motion: reduce) { .touch-note { transition: none; } }
    .foot { font-size: .78rem; color: var(--text-muted); line-height: 1.5; }
    .empty { text-align: center; color: var(--text-muted); padding: 40px 0; }

    /* ── Day at a glance ── */
    /* One indent, in rem. This was 8.4em on three elements at three different
       font sizes, which resolved to 110px / 134px / 105px — badges sat right of
       the row they belonged to, descriptions sat left of it. */
    .glance { --care-indent: 6.6rem; }
    .care-row {
      display: flex; align-items: baseline; gap: 10px;
      padding: 7px 0; border-top: 1px solid var(--cream-2);
    }
    .care-row:first-of-type { border-top: none; }
    .care-time {
      font-variant-numeric: tabular-nums; font-size: .82rem;
      color: var(--text-muted); white-space: nowrap; min-width: var(--care-indent);
    }
    .care-what { font-size: .92rem; font-weight: 600; flex: 1; }
    .care-dur {
      font-size: .78rem; color: var(--text-muted);
      font-variant-numeric: tabular-nums; white-space: nowrap;
    }
    /* Sleep is the one row that reads as a block of the day rather than a moment. */
    .care-sleep .care-what { color: var(--sleep); }
    .care-feeding .care-what { color: var(--feed); }
    .care-badges {
      display: flex; flex-wrap: wrap; gap: 5px;
      margin: 0 0 4px calc(var(--care-indent) + 10px);
    }
    .play-badge {
      font-size: .7rem; font-weight: 600; padding: 2px 8px; border-radius: 999px;
      background: var(--play-a); color: var(--play);
    }
    .care-desc {
      font-size: .78rem; color: var(--text-muted); line-height: 1.45;
      margin: 0 0 6px calc(var(--care-indent) + 10px);
    }
    .care-bands {
      margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--cream-2);
      font-size: .78rem; color: var(--text-muted);
    }
    @media (max-width: 420px) {
      /* Dropping the indent to zero used to put descriptions under the time
         column with nothing tying them to their row. A rule keeps the ownership. */
      .glance { --care-indent: 0rem; }
      .care-badges, .care-desc {
        margin-left: 6px; padding-left: 8px; border-left: 2px solid var(--cream-2);
      }
    }
  </style>
</head>
<body>
  <div class="header">
    <h1><span aria-hidden="true">🧑‍🍼</span> Nanny Report</h1>
    <a class="back" href="/">← back to tracker</a>
  </div>

  <div class="datebar"><select id="dateSel"></select></div>
  <div class="touch-note" id="touchNote" role="status" aria-live="polite"></div>
  <div id="content"><div class="empty">Loading…</div></div>

<script>
const contentEl = document.getElementById("content");
const dateSel = document.getElementById("dateSel");

function fmtTime(iso) {
  return new Date(iso).toLocaleTimeString([], {hour: "numeric", minute: "2-digit"});
}
function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}
function fmtMin(m) {
  m = Math.round(m || 0);
  if (m < 60) return m + "m";
  const h = Math.floor(m / 60), r = m % 60;
  return r ? h + "h " + r + "m" : h + "h";
}
// [text, label, warn?] → the 2x2 tile grid used by every metric block.
function tileRow(defs) {
  const grid = el("div", "tiles");
  for (const [num, lbl, warn] of defs) {
    const t = el("div", "tile" + (warn ? " warn" : ""));
    t.append(el("div", "num", String(num)), el("div", "lbl", lbl));
    grid.append(t);
  }
  return grid;
}
// Evidence clips are now ~40s cut around the model's key moment rather than the
// whole event, but 0.5x still matters: deciding whether something really is a
// phone is a slow-down job, not a speed-up one.
const PLAYBACK_RATES = [0.5, 1, 2, 4];

function evidenceVideo(clipPath) {
  const wrap = el("div");
  const v = document.createElement("video");
  v.controls = true; v.preload = "none";
  v.src = "/nanny/clips/" + clipPath;
  const bar = el("div", "speeds");
  for (const rate of PLAYBACK_RATES) {
    const b = el("button", "speed" + (rate === 1 ? " on" : ""), rate + "×");
    b.type = "button";
    b.addEventListener("click", () => {
      v.playbackRate = rate;
      for (const other of bar.children) other.classList.toggle("on", other === b);
    });
    bar.append(b);
  }
  wrap.append(v, bar);
  return wrap;
}

function kvRow(label, value) {
  const r = el("div", "kv-row");
  r.append(el("div", null, label), el("div", "kv-val", value));
  return r;
}

const CATEGORY_LABELS = {
  feeding: "Feeding", diaper: "Diaper", play: "Play", holding_baby: "Holding baby",
  sleep_prep: "Sleep prep", housework: "Housework", eating: "Eating",
  resting: "Resting", out_of_frame: "Caregiver out of frame", other: "Other",
};

const CARE_LABELS = {
  feeding: "Feed", diaper: "Diaper", play: "Play", sleep: "Sleep",
};
const CARE_ICONS = {
  feeding: "🍼", diaper: "💩", play: "🧸", sleep: "😴",
};
const PLAY_LABELS = {
  tummy_time: "Tummy time", floor_toys: "Floor toys", books: "Books",
  singing_talking: "Singing / talking", held_interactive: "Held — interactive",
  held_passive: "Held — passive", outdoor: "Outdoor", other: "Other play",
};

const CONTEXT_LABELS = {
  while_holding_baby: ["holding baby", "danger"],
  baby_nearby_awake:  ["baby awake nearby", "danger"],
  baby_unattended:    ["baby unattended", "danger"],
  baby_napping:       ["during nap", "nap"],
  baby_not_in_frame:  ["baby not in frame", ""],
  unclear:            ["unclear", ""],
};

// Verdict against the house rule, decided server-side in classify_phone_use().
const AUTH_LABELS = {
  unauthorized:        ["⚠️ not allowed", "danger"],
  allowed_baby_asleep: ["ok — baby asleep", "nap"],
  // Baby not in this camera's view and no other camera in the room saw her
  // awake. Not a finding, so it carries no evidence clip.
  allowed_baby_absent: ["ok — baby not in view", "nap"],
  unconfirmed:         ["unconfirmed", ""],
  unclear:             ["unclear", ""],
  // Someone who isn't the nanny: shown because it explains what's on camera,
  // but counted toward nothing — this report measures the caregiver's hours.
  not_caregiver:       ["not the caregiver", ""],
};

// Pure DOM, like index.html's week grid — no chart library has a "day vs one
// scalar, shaded by confidence" type, and DOM blocks inherit the :root custom
// properties so dark mode comes free.
const TREND_MIN_COVERAGE = 75;

function renderTrend(trend) {
  if (!trend || trend.length < 2) return;
  const c = el("div", "card");
  c.append(el("h2", null, "Last " + trend.length + " days"));
  const peak = Math.max(10, ...trend.map(d => d.unauthorized_minutes || 0));
  const strip = el("div", "trend");
  for (const d of trend) {
    const thin = (d.coverage_pct ?? 0) < TREND_MIN_COVERAGE;
    // A button, not a div: these were unreachable by keyboard or screen reader,
    // labelled only by `title`, which touch never shows.
    const col = el("button", "day " + (d.verdict_level || "clear") + (thin ? " thin" : ""));
    col.type = "button";
    const bar = el("div", "bar");
    bar.style.height = Math.round(4 + 70 * (d.unauthorized_minutes || 0) / peak) + "px";
    const nice = new Date(d.date + "T12:00:00")
      .toLocaleDateString("en-US", {weekday: "short", month: "short", day: "numeric"});
    const label = nice + " — " + Math.round(d.unauthorized_minutes || 0) +
      " min flagged, " + (d.coverage_pct ?? 0) + "% covered" +
      (d.notable_count ? ", " + d.notable_count + " notable" : "");
    col.title = label;
    col.setAttribute("aria-label", label);
    col.append(bar);
    col.onclick = () => alertLine(label);
    strip.append(col);
  }
  // .tick was defined in CSS and never created — so on touch, where there is
  // no hover, nothing identified any of these 28 bars.
  const ticks = el("div", "trend");
  ticks.style.height = "auto";
  trend.forEach((d, i) => {
    const t = el("div", "tick", (i === 0 || i === trend.length - 1 || i % 7 === 0)
      ? d.date.slice(5) : "");
    t.style.flex = "1";
    ticks.append(t);
  });
  c.append(strip, ticks);
  c.append(el("div", "rule",
    "Height is flagged minutes. Hatched days had under " + TREND_MIN_COVERAGE +
    "% camera coverage — too little was reviewed to call them clear, so read them " +
    "as unknown rather than as good days."));
  contentEl.append(c);
}

// The care record is what a parent needs to understand first. Keep these
// factual summaries together and ahead of every evidence clip.
function renderCareOverview(report) {
  // Every metric block is guarded on its key: a report JSON written before
  // these existed must still render the rest of the page.
  const att = report.attendance;
  if (att) {
    const c = el("div", "card");
    c.append(el("h2", null, "Attendance"));
    c.append(tileRow([
      [fmtMin(att.unattended_minutes), "awake & alone", att.unattended_minutes > 0],
      [fmtMin(att.longest_unattended_stretch_minutes), "longest alone", false],
      [fmtMin(att.caregiver_present_minutes), "caregiver in view", false],
      [fmtMin(att.unclear_minutes), "unclear", false],
    ]));
    c.append(el("div", "rule",
      "Counts only an awake baby with no caregiver visible on any camera; a " +
      "sleeping baby alone is not counted. " + fmtMin(att.uncovered_minutes) +
      " of the window had no footage at all and is counted as unclear, never " +
      "as time alone."));
    for (const iv of att.unattended_intervals || []) {
      c.append(kvRow(fmtTime(iv.start_iso) + " – " + fmtTime(iv.end_iso), "alone"));
    }
    contentEl.append(c);
  }

  const sl = report.sleep;
  if (sl) {
    const c = el("div", "card");
    c.append(el("h2", null, "Sleep"));
    c.append(tileRow([
      [fmtMin(sl.total_sleep_minutes), "asleep", false],
      [String(sl.nap_count ?? 0), "naps", false],
      [fmtMin(sl.longest_nap_minutes), "longest nap", false],
      [fmtMin(sl.longest_awake_stretch_minutes), "longest awake", false],
    ]));
    // The per-nap list used to live here, reprinting the exact times and durations
    // the Day at a glance card already shows as sleep rows. Four tiles plus the
    // disagreement note is what this card uniquely knows.
    // The two sources of "asleep" are independent, so a disagreement is a
    // signal in itself: bedroom naps are invisible to the crib monitor, but
    // crib-only minutes mean one of the two is wrong.
    const cribOnly = sl.crib_only_minutes || 0, camOnly = sl.camera_only_minutes || 0;
    if (cribOnly >= 10 || camOnly >= 10) {
      const parts = [];
      if (camOnly >= 10) parts.push("the cameras saw " + fmtMin(camOnly) +
        " the crib monitor did not (expected for naps outside the nursery)");
      if (cribOnly >= 10) parts.push("the crib monitor saw " + fmtMin(cribOnly) +
        " the cameras did not");
      c.append(el("div", "rule", "Sources disagree: " + parts.join("; ") + "."));
    }
    contentEl.append(c);
  }

  // The "Care activities" minutes-by-category card was removed. Sorted descending,
  // its top row was almost always "Caregiver out of frame — 3h 12m", which reads as
  // an accusation but only means "not in this camera's crop". The Day at a glance
  // card already carries the same information, per-event and correctly worded.
}

function renderGlance(report) {
  // What the parent opens the page for, so it leads. It used to render 11th,
  // roughly 3,000px down, behind the audit sections and six inline video players.
  // The full log below is unchanged — this is the merged view of the same data.
  // merged view of the same data, since one feed arrives as up to seven fragments.
  const ct = report.care_timeline;
  if (ct && ct.events && ct.events.length) {
    const g = el("div", "card glance");
    g.append(el("h2", null, "Day at a glance"));
    for (const e of ct.events) {
      const row = el("div", "care-row care-" + e.category);
      // Diapers are instants in practice — several ran under a minute, and a
      // "17:00–17:00" range reads as a bug rather than a quick change.
      const instant = e.category === "diaper" && e.minutes < 2;
      row.append(el("span", "care-time",
        instant ? fmtTime(e.start_iso)
                : fmtTime(e.start_iso) + "–" + fmtTime(e.end_iso)));
      row.append(el("span", "care-what",
        (CARE_ICONS[e.category] || "") + " " + (CARE_LABELS[e.category] || e.category)));
      row.append(el("span", "care-dur", instant ? "" : fmtMin(e.minutes)));
      g.append(row);

      if (e.play_types && e.play_types.length) {
        const badges = el("div", "care-badges");
        for (const t of e.play_types) {
          badges.append(el("span", "play-badge", PLAY_LABELS[t] || t));
        }
        g.append(badges);
      }
      // Play only. A feed, a nap and a diaper change say everything they need to
      // in their time and duration; the model's prose under each just made the
      // card long. Play is the one where what actually happened is the point.
      if (e.category === "play" && e.description) {
        g.append(el("div", "care-desc", e.description));
      }
    }
    const b = ct.bands || {};
    const mins = list => (list || []).reduce((a, s) =>
      a + (new Date(s.end_iso) - new Date(s.start_iso)) / 60000, 0);
    // "elsewhere", not "away": most of this band is out_of_frame, which means not
    // in THIS camera's view — the caregiver may well be with the baby in another room.
    g.append(el("div", "care-bands",
      `The rest of the day: ${fmtMin(mins(b.with_baby))} holding or settling her · ` +
      `${fmtMin(mins(b.away))} housework, breaks, or elsewhere in the house`));
    contentEl.append(g);
  }
}

function render(report, status, trend) {
  contentEl.textContent = "";
  if (!report) {
    contentEl.append(el("div", "empty", "No report for this date yet. Reports are generated after 6:45 pm on care days."));
    return;
  }

  for (const err of report.config_errors || []) {
    const c = el("div", "card alert");
    c.append(el("h2", null, "Configuration problem"),
             el("p", "narrative", err),
             el("p", "rule", "Fix this in /etc/nursery-tracker/nanny.env. The report below " +
                "was still produced, but with this setting ignored."));
    contentEl.append(c);
  }

  if (report.no_analysis) {
    const c = el("div", "card alert");
    c.append(el("h2", null, "No footage analyzed"),
             el("p", "narrative",
                "Nothing was analyzed for this day — no camera footage made it through the " +
                "pipeline. Check the analyzer status at the bottom of this page."));
    contentEl.append(c);
  }

  // The verdict comes first and is computed server-side in Python from the
  // classified numbers — never by the model. Everything below explains it.
  const v = report.verdict;
  if (v) {
    const c = el("div", "card verdict " + v.level);
    c.append(el("div", "line", v.headline));
    if (v.reasons && v.reasons.length) {
      c.append(el("div", "why", v.reasons.join(" · ")));
    }
    contentEl.append(c);
  }

  // Ordered as reassurance, not as an audit: the story of the day first,
  // the numbers that support it second, the evidence third.
  renderGlance(report);
  renderCareOverview(report);

  // Evidence review follows the factual care overview, while notable events
  // still lead the clip-heavy part of the report.
  if (report.notable_events && report.notable_events.length) {
    const c = el("div", "card alert");
    c.append(el("h2", null, "Notable events"));
    for (const n of report.notable_events) {
      const box = el("div", "phone-event" + (n.type === "safety_concern" ? " flagged" : ""));
      const when = el("div", "when", fmtTime(n.time_iso));
      when.append(el("span", "badge " + (n.type === "safety_concern" ? "danger" : ""),
                     (n.type || "other").replace(/_/g, " ")));
      when.append(el("span", "badge", n.room || n.camera));
      box.append(when, el("div", "desc", n.description));
      if (n.also_seen_by && n.also_seen_by.length) {
        box.append(el("div", "desc", "Also seen by " + n.also_seen_by.join(", ") + "."));
      }
      if (n.clip) {
        box.append(evidenceVideo(n.clip));
      } else {
        box.append(el("div", "desc", "No clip for this event."));
      }
      c.append(box);
    }
    contentEl.append(c);
  }

  const st0 = report.storage || {};
  if (st0.dropped_for_disk_pressure) {
    const c = el("div", "card alert");
    c.append(el("h2", null, "Footage was deleted unwatched"),
             el("p", "narrative", st0.dropped_for_disk_pressure +
                " segment(s) were deleted before analysis because the disk filled. " +
                "That footage is gone; the days below are incomplete."));
    contentEl.append(c);
  }

  for (const w of report.warnings || []) {
    contentEl.append(el("div", "rule", "⚠️ " + w));
  }

  if (report.narrative) {
    const c = el("div", "card");
    const h = el("h2", null, "Day summary");
    // Labelled, so a soothing paragraph is never mistaken for the verdict it
    // sits under: this is a second LLM pass over the first LLM's summaries.
    h.append(el("span", "model-tag", "AI-written"));
    c.append(h, el("p", "narrative", report.narrative));
    contentEl.append(c);
  }

  // The one field read unguarded; every other block tolerates old JSON.
  const pu = report.phone_use || {events: []};
  const asleepMin = pu.while_baby_asleep_minutes ?? pu.during_naps_minutes ?? 0;
  const unauthMin = pu.unauthorized_minutes ?? 0;
  const flagged = unauthMin > 0 || (pu.unauthorized_event_count || 0) > 0;

  if (pu.events && pu.events.length) {
    // Nothing flagged is the common case, and it cost five equal-weight tiles plus
    // a card of inline video players — over a thousand pixels restating what the
    // verdict already says in one line. Collapse it; open it only when it matters.
    const c = el("div", "card");
    let body = c;
    if (flagged) {
      c.append(el("h2", null, "Phone use · " + pu.event_count + " events"));
      c.append(tileRow([
        [fmtMin(unauthMin), "not allowed", true],
        [fmtMin(pu.total_minutes), "phone total", false],
      ]));
    } else {
      const d = el("details");
      d.append(el("summary", "h2-summary",
        "Phone use · " + fmtMin(pu.total_minutes) + " total, none flagged"));
      c.append(d);
      body = d;
    }
    // Denominators are context, not findings: shown at the same weight as the one
    // number that IS a finding, they read as accusations too.
    for (const [label, val] of [["while baby asleep", asleepMin],
                                ["baby not in view", pu.while_baby_absent_minutes ?? 0],
                                ["unclear", pu.unclear_minutes ?? 0]]) {
      if (val > 0) body.append(kvRow(label, fmtMin(val)));
    }
    const rule = el("div", "rule",
      "House rule: phone is fine while the baby sleeps, not while the caregiver is " +
      "with an awake baby.");
    if (pu.unauthorized_unconfirmed_minutes > 0) {
      rule.append(el("div", null, "+" + Math.round(pu.unauthorized_unconfirmed_minutes) +
        "m more would be flagged if the low-confidence detections below are really a phone."));
    }
    if (pu.other_adult_event_count > 0) {
      rule.append(el("div", null, pu.other_adult_event_count +
        " event(s) below were another adult rather than the caregiver, and count toward nothing."));
    }
    body.append(rule);
    for (const ev of pu.events) {
      const box = el("div", "phone-event" + (ev.authorization === "unauthorized" ? " flagged" : ""));
      // Sub-minute events rendered as "5:00 PM – 5:00 PM", which reads as a bug in
      // the data rather than a very short event, and hid a run of 4-16s false
      // positives for weeks. Show the duration instead when both ends collapse.
      const evSecs = (new Date(ev.end_iso) - new Date(ev.start_iso)) / 1000;
      const when = el("div", "when", evSecs < 60
        ? fmtTime(ev.start_iso) + " · " + Math.round(evSecs) + "s"
        : fmtTime(ev.start_iso) + " – " + fmtTime(ev.end_iso));
      const [albl, akind] = AUTH_LABELS[ev.authorization] || [];
      if (albl) when.append(el("span", "badge " + akind, albl));
      const [lbl, kind] = CONTEXT_LABELS[ev.context] || [ev.context, ""];
      when.append(el("span", "badge " + kind, lbl));
      box.append(when);
      // Room and confidence are metadata, demoted out of the badge row so the
      // one badge that can start a conversation is not one of five identical
      // pills. Confidence is always shown: a medium detection counts toward the
      // flagged minutes and used to look exactly like a high one.
      box.append(el("div", "desc",
        (ev.room || ev.camera) + " · " + (ev.confidence || "unknown") + " confidence"));
      if (ev.description) box.append(el("div", "desc", ev.description));
      // One event, one video: the other cameras that saw the same moment are
      // credited in text rather than repeated as a second clip of it.
      if (ev.also_seen_by && ev.also_seen_by.length) {
        box.append(el("div", "desc", "Also seen by " + ev.also_seen_by.join(", ") + "."));
      }
      if (ev.clip) {
        // The clip is a ~40s window around the key moment, not the whole event,
        // so say what the reader is looking at relative to the event's span.
        if (ev.key_moment_iso) {
          box.append(el("div", "desc", "Clip: ~40s around " + fmtTime(ev.key_moment_iso) +
                        ", the clearest moment of this event."));
        }
        if (ev.authorization === "unauthorized") {
          box.append(evidenceVideo(ev.clip));
        } else {
          // An allowed event is not a finding, so its clip need not load and be
          // scrolled past — six black rectangles down a cream page.
          const btn = el("button", "btn", "Watch 40s clip");
          btn.type = "button";
          btn.onclick = () => btn.replaceWith(evidenceVideo(ev.clip));
          box.append(btn);
        }
      }
      body.append(box);
    }
    contentEl.append(c);
  }

  const tl = el("details", "card");
  tl.append(el("summary", "h2-summary", "Full log · " + report.timeline.length + " spans"));
  const naps = (report.naps || []).slice();
  let napIdx = 0, lastHour = null, group = null;
  for (const span of report.timeline) {
    const start = new Date(span.start_iso);
    while (napIdx < naps.length && new Date(naps[napIdx].start_iso) <= start) {
      const n = naps[napIdx++];
      (group || tl).append(el("div", "nap-band",
        "😴 nap " + fmtTime(n.start_iso) + " – " + fmtTime(n.end_iso)));
    }
    const hour = start.getHours();
    if (hour !== lastHour) {
      lastHour = hour;
      group = el("div", "hour-group");
      group.append(el("div", "hour-label",
        start.toLocaleTimeString([], {hour: "numeric"})));
      tl.append(group);
    }
    const row = el("div", "tl-row");
    row.append(
      el("span", "tl-time", fmtTime(span.start_iso) + "–" + fmtTime(span.end_iso)),
      el("span", null, span.description || span.category),
      el("span", "tl-cam", span.room && span.room !== span.camera
        ? span.room + " · " + span.camera : span.camera));
    group.append(row);
  }
  while (napIdx < naps.length) {
    const n = naps[napIdx++];
    tl.append(el("div", "nap-band", "😴 nap " + fmtTime(n.start_iso) + " – " + fmtTime(n.end_iso)));
  }
  if (!report.timeline.length) tl.append(el("div", "empty", "No activity recorded."));
  contentEl.append(tl);

  renderTrend(trend);

  const how = el("details", "card");
  how.append(el("summary", "h2-summary", "How this is measured"));
  how.append(el("p", "rule",
    "This system is deliberately tuned to give the benefit of the doubt: only " +
    "medium/high-confidence detections can be flagged, anything two cameras " +
    "disagree about is cleared rather than counted, and anything unproven is " +
    "\u201cunclear\u201d, never a flag. Read the absence of a flag with that in mind. " +
    "Clips are ~40s around the moment the model judged clearest, not the whole event."));
  contentEl.append(how);

  const foot = el("details", "card");
  foot.append(el("summary", "h2-summary", "Coverage & diagnostics"));
  const f = el("div", "foot");
  const lines = [];
  if (report.room_coverage) {
    lines.push("decision coverage: " + (report.decision_coverage_pct ?? "?") + "%");
    for (const [room, cov] of Object.entries(report.room_coverage)) {
      const gapNote = cov.gaps.length && !cov.gaps[0].whole_day
        ? cov.gaps.map(g => fmtTime(g.start_iso) + "–" + fmtTime(g.end_iso)).join(", ")
        : (cov.gaps.length ? "no footage all day" : "none");
      lines.push(room + ": " + cov.analyzed_minutes + "/" + cov.window_minutes +
                 " min observed" + (cov.gaps.length ? " · gaps: " + gapNote : ""));
    }
    lines.push("camera diagnostics:");
  }
  for (const [cam, cov] of Object.entries(report.coverage || {})) {
    const gapNote = cov.gaps.length && !cov.gaps[0].whole_day
      ? cov.gaps.map(g => fmtTime(g.start_iso) + "–" + fmtTime(g.end_iso)).join(", ")
      : (cov.gaps.length ? "no footage all day" : "none");
    const room = (report.rooms || {})[cam];
    lines.push(cam + (room && room !== cam ? " (" + room + ")" : "") + ": " +
               cov.analyzed_minutes + "/" + cov.window_minutes +
               " min analyzed" + (cov.gaps.length ? " · gaps: " + gapNote : ""));
  }
  for (const fl of report.failures || []) {
    lines.push("⚠️ " + (fl.room || fl.camera) + " " + fmtTime(fl.segment_start_iso) +
               " not analyzed — " + fl.error + (fl.detail ? " (" + fl.detail + ")" : ""));
  }
  // parse_errors also counts the failures above; only report what they don't explain.
  const unexplained = (report.parse_errors || 0) - (report.failures || []).length;
  if (unexplained > 0) lines.push(unexplained + " segment(s) had unreadable analysis output");

  const an = (status || {}).analyze;
  if (an) {
    lines.push("analyzer last ran " + new Date(an.at).toLocaleString() + " — " +
               (an.done || 0) + " segment(s) analyzed, " + (an.failed || 0) + " failed" +
               (an.paced_seconds ? ", " + Math.round(an.paced_seconds / 60) + " min paced for quota" : ""));
  } else {
    lines.push("analyzer has not recorded a run yet");
  }
  const st = report.storage;
  if (st) {
    let line = "disk: " + (st.free_gb ?? "?") + " GB free (floor " + st.free_floor_gb + " GB)";
    if (st.pending_segments) {
      line += " · " + st.pending_segments + " hour(s) of footage still unanalyzed" +
        (st.oldest_pending_hours ? ", oldest " + st.oldest_pending_hours + "h old" : "");
    }
    if (st.dropped_for_disk_pressure) {
      line += " · ⚠️ " + st.dropped_for_disk_pressure +
        " segment(s) deleted unanalyzed for disk pressure";
    }
    lines.push(line);
  }
  lines.push("generated " + new Date(report.generated_at).toLocaleString());
  f.textContent = lines.join("\n");
  f.style.whiteSpace = "pre-line";
  foot.append(f);
  contentEl.append(foot);
}

function alertLine(msg) {
  const t = document.getElementById("touchNote");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(alertLine._t);
  alertLine._t = setTimeout(() => t.classList.remove("show"), 4000);
}

async function load(dateStr) {
  const url = dateStr ? "/nanny/data?date=" + dateStr : "/nanny/data";
  let res;
  try {
    res = await fetch(url);
  } catch (_) {
    contentEl.textContent = "";
    contentEl.append(el("div", "empty",
      "Can't reach the tracker. Check the Pi is on the network, then reload."));
    return;
  }
  const data = await res.json();
  dateSel.textContent = "";
  for (const d of data.dates) {
    const opt = document.createElement("option");
    opt.value = d;
    opt.textContent = new Date(d + "T12:00:00").toLocaleDateString([], {weekday: "short", month: "short", day: "numeric"});
    dateSel.append(opt);
  }
  if (data.report) dateSel.value = data.report.date;
  if (!data.dates.length) {
    contentEl.textContent = "";
    contentEl.append(el("div", "empty", "No reports yet. The first report appears after the first recorded care day."));
    return;
  }
  render(data.report, data.status, data.trend);
}

dateSel.addEventListener("change", () => load(dateSel.value));
load();
</script>
</body>
</html>
