<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nanny Report</title>
  <style>
    :root {
      --cream:       #faf3e8;
      --cream-2:     #f2e6d0;
      --brown-deep:  #3d2b1f;
      --brown-mid:   #7a4f35;
      --brown-light: #a07858;
      --brown-muted: #b8957a;
      --text-muted:  #8a6a52;
      --surface:     #fff;
      --feed:  #5aaa72;  --feed-a:  rgba(90,170,114,.10);
      --danger: #c0513a;  --danger-a: rgba(192,81,58,.12);
      --sleep:   #5c7fa3;  --sleep-a: rgba(92,127,163,.13);
      --phone:   #8e6abf;  --phone-a: rgba(142,106,191,.12);
      --shadow-card: 0 1px 3px rgba(61,43,31,.07), 0 6px 18px rgba(61,43,31,.07);
      --r: 18px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --cream:       #1c1712;
        --cream-2:     #2c2218;
        --brown-deep:  #f0e6d8;
        --brown-mid:   #cda077;
        --brown-light: #b89677;
        --brown-muted: #6e5a47;
        --text-muted:  #b6a087;
        --surface:     #271f17;
        --shadow-card: 0 1px 3px rgba(0,0,0,.35), 0 6px 18px rgba(0,0,0,.40);
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--cream);
      color: var(--brown-deep);
      min-height: 100vh;
      padding: 24px 16px 48px;
      max-width: 680px;
      margin: 0 auto;
    }
    .header { text-align: center; margin-bottom: 20px; }
    h1 {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 1.65rem; font-weight: normal;
      color: var(--brown-mid); letter-spacing: -0.01em; margin-bottom: 4px;
    }
    .back { font-size: .82rem; color: var(--text-muted); text-decoration: none; }
    .back:hover { color: var(--brown-mid); }
    .datebar { display: flex; justify-content: center; margin: 14px 0 20px; }
    select {
      font: inherit; padding: 8px 14px; border-radius: 12px;
      border: 1px solid var(--brown-muted); background: var(--surface);
      color: var(--brown-deep);
    }
    .card {
      background: var(--surface); border-radius: var(--r);
      box-shadow: var(--shadow-card); padding: 18px; margin-bottom: 14px;
    }
    .card h2 {
      font-size: .82rem; text-transform: uppercase; letter-spacing: .06em;
      color: var(--text-muted); font-weight: 600; margin-bottom: 10px;
    }
    .narrative { line-height: 1.55; font-size: .95rem; }
    .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
    .tile {
      background: var(--surface); border-radius: var(--r);
      box-shadow: var(--shadow-card); padding: 14px; text-align: center;
    }
    .tile .num { font-size: 1.6rem; font-weight: 600; color: var(--brown-mid); }
    .tile .lbl { font-size: .72rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: .05em; margin-top: 2px; }
    .tile.warn { background: var(--danger-a); }
    .tile.warn .num { color: var(--danger); }
    .phone-event { border-left: 3px solid var(--phone); padding: 8px 12px; margin-bottom: 12px; background: var(--phone-a); border-radius: 0 10px 10px 0; }
    .phone-event.flagged { border-left-color: var(--danger); background: var(--danger-a); }
    .rule { font-size: .78rem; color: var(--text-muted); line-height: 1.45; margin-bottom: 10px; }
    .phone-event .when { font-weight: 600; font-size: .9rem; }
    .phone-event .desc { font-size: .85rem; color: var(--text-muted); margin: 3px 0; }
    .badge {
      display: inline-block; font-size: .68rem; padding: 2px 8px; border-radius: 999px;
      background: var(--cream-2); color: var(--brown-mid); margin-left: 6px;
      text-transform: uppercase; letter-spacing: .04em;
    }
    .badge.danger { background: var(--danger-a); color: var(--danger); }
    .badge.nap { background: var(--sleep-a); color: var(--sleep); }
    video { width: 100%; border-radius: 10px; margin-top: 8px; background: #000; }
    .hour-group { margin-bottom: 14px; }
    .hour-label { font-size: .78rem; color: var(--text-muted); font-weight: 600; margin-bottom: 6px; }
    .tl-row { display: flex; gap: 10px; font-size: .88rem; padding: 4px 0; }
    .tl-time { color: var(--text-muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
    .tl-cam { color: var(--brown-light); font-size: .75rem; white-space: nowrap; padding-top: 1px; }
    .nap-band {
      background: var(--sleep-a); border-radius: 8px; padding: 5px 10px;
      font-size: .82rem; color: var(--sleep); margin: 6px 0;
    }
    .foot { font-size: .78rem; color: var(--text-muted); line-height: 1.5; }
    .empty { text-align: center; color: var(--text-muted); padding: 40px 0; }
  </style>
</head>
<body>
  <div class="header">
    <h1>🧑‍🍼 Nanny Report</h1>
    <a class="back" href="/">← back to tracker</a>
  </div>

  <div class="datebar"><select id="dateSel"></select></div>
  <div id="content"><div class="empty">Loading…</div></div>

<script>
const contentEl = document.getElementById("content");
const dateSel = document.getElementById("dateSel");

function fmtTime(iso) {
  return new Date(iso).toLocaleTimeString([], {hour: "numeric", minute: "2-digit"});
}
function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

const CONTEXT_LABELS = {
  while_holding_baby: ["holding baby", "danger"],
  baby_nearby_awake:  ["baby awake nearby", "danger"],
  baby_unattended:    ["baby unattended", "danger"],
  baby_napping:       ["during nap", "nap"],
  baby_not_in_frame:  ["baby not in frame", ""],
  unclear:            ["unclear", ""],
};

// Verdict against the house rule, decided server-side in classify_phone_use().
const AUTH_LABELS = {
  unauthorized:        ["⚠️ not allowed", "danger"],
  allowed_baby_asleep: ["ok — baby asleep", "nap"],
  unconfirmed:         ["unconfirmed", ""],
  unclear:             ["unclear", ""],
};

function render(report) {
  contentEl.textContent = "";
  if (!report) {
    contentEl.append(el("div", "empty", "No report for this date yet. Reports are generated after 6:45 pm on care days."));
    return;
  }

  if (report.narrative) {
    const c = el("div", "card");
    c.append(el("h2", null, "Day summary"), el("p", "narrative", report.narrative));
    contentEl.append(c);
  }

  const pu = report.phone_use;
  const asleepMin = pu.while_baby_asleep_minutes ?? pu.during_naps_minutes ?? 0;
  const unauthMin = pu.unauthorized_minutes ?? 0;
  const tiles = el("div", "tiles");
  const tileDefs = [
    [Math.round(pu.total_minutes) + "m", "phone total", false],
    [Math.round(unauthMin) + "m", "not allowed", unauthMin > 0],
    [Math.round(asleepMin) + "m", "while baby asleep", false],
    [Math.round(pu.unclear_minutes ?? 0) + "m", "unclear", false],
  ];
  for (const [num, lbl, warn] of tileDefs) {
    const t = el("div", "tile" + (warn ? " warn" : ""));
    t.append(el("div", "num", String(num)), el("div", "lbl", lbl));
    tiles.append(t);
  }
  contentEl.append(tiles);

  if (pu.events.length) {
    const c = el("div", "card");
    c.append(el("h2", null, "Phone use · " + pu.event_count + " events"));
    const rule = el("div", "rule",
      "House rule: phone is fine while the baby sleeps, not while the caregiver is " +
      "with an awake baby.");
    if (pu.unauthorized_unconfirmed_minutes > 0) {
      rule.append(el("div", null, "+" + Math.round(pu.unauthorized_unconfirmed_minutes) +
        "m more would be flagged if the low-confidence detections below are really a phone."));
    }
    c.append(rule);
    for (const ev of pu.events) {
      const box = el("div", "phone-event" + (ev.authorization === "unauthorized" ? " flagged" : ""));
      const when = el("div", "when", fmtTime(ev.start_iso) + " – " + fmtTime(ev.end_iso));
      const [albl, akind] = AUTH_LABELS[ev.authorization] || [];
      if (albl) when.append(el("span", "badge " + akind, albl));
      const [lbl, kind] = CONTEXT_LABELS[ev.context] || [ev.context, ""];
      when.append(el("span", "badge " + kind, lbl));
      when.append(el("span", "badge", ev.room || ev.camera));
      if (ev.confidence === "low") when.append(el("span", "badge", "low confidence"));
      box.append(when);
      if (ev.description) box.append(el("div", "desc", ev.description));
      if (ev.clip) {
        const v = document.createElement("video");
        v.controls = true; v.preload = "none";
        v.src = "/nanny/clips/" + ev.clip;
        box.append(v);
      }
      c.append(box);
    }
    contentEl.append(c);
  }

  const tl = el("div", "card");
  tl.append(el("h2", null, "Timeline"));
  const naps = (report.naps || []).slice();
  let napIdx = 0, lastHour = null, group = null;
  for (const span of report.timeline) {
    const start = new Date(span.start_iso);
    while (napIdx < naps.length && new Date(naps[napIdx].start_iso) <= start) {
      const n = naps[napIdx++];
      (group || tl).append(el("div", "nap-band",
        "😴 nap " + fmtTime(n.start_iso) + " – " + fmtTime(n.end_iso)));
    }
    const hour = start.getHours();
    if (hour !== lastHour) {
      lastHour = hour;
      group = el("div", "hour-group");
      group.append(el("div", "hour-label",
        start.toLocaleTimeString([], {hour: "numeric"})));
      tl.append(group);
    }
    const row = el("div", "tl-row");
    row.append(
      el("span", "tl-time", fmtTime(span.start_iso) + "–" + fmtTime(span.end_iso)),
      el("span", null, span.description || span.category),
      el("span", "tl-cam", span.room && span.room !== span.camera
        ? span.room + " · " + span.camera : span.camera));
    group.append(row);
  }
  while (napIdx < naps.length) {
    const n = naps[napIdx++];
    tl.append(el("div", "nap-band", "😴 nap " + fmtTime(n.start_iso) + " – " + fmtTime(n.end_iso)));
  }
  if (!report.timeline.length) tl.append(el("div", "empty", "No activity recorded."));
  contentEl.append(tl);

  if (report.notable_events && report.notable_events.length) {
    const c = el("div", "card");
    c.append(el("h2", null, "Notable events"));
    for (const n of report.notable_events) {
      const row = el("div", "tl-row");
      row.append(el("span", "tl-time", fmtTime(n.time_iso)),
                 el("span", null, n.description),
                 el("span", "tl-cam", n.camera));
      c.append(row);
    }
    contentEl.append(c);
  }

  const foot = el("div", "card");
  foot.append(el("h2", null, "Coverage"));
  const f = el("div", "foot");
  const lines = [];
  for (const [cam, cov] of Object.entries(report.coverage || {})) {
    const gapNote = cov.gaps.length && !cov.gaps[0].whole_day
      ? cov.gaps.map(g => fmtTime(g.start_iso) + "–" + fmtTime(g.end_iso)).join(", ")
      : (cov.gaps.length ? "no footage all day" : "none");
    const room = (report.rooms || {})[cam];
    lines.push(cam + (room && room !== cam ? " (" + room + ")" : "") + ": " +
               cov.analyzed_minutes + "/" + cov.window_minutes +
               " min analyzed" + (cov.gaps.length ? " · gaps: " + gapNote : ""));
  }
  if (report.parse_errors) lines.push(report.parse_errors + " segment(s) had unreadable analysis output");
  lines.push("generated " + new Date(report.generated_at).toLocaleString());
  f.textContent = lines.join("\n");
  f.style.whiteSpace = "pre-line";
  foot.append(f);
  contentEl.append(foot);
}

async function load(dateStr) {
  const url = dateStr ? "/nanny/data?date=" + dateStr : "/nanny/data";
  const res = await fetch(url);
  const data = await res.json();
  dateSel.textContent = "";
  for (const d of data.dates) {
    const opt = document.createElement("option");
    opt.value = d;
    opt.textContent = new Date(d + "T12:00:00").toLocaleDateString([], {weekday: "short", month: "short", day: "numeric"});
    dateSel.append(opt);
  }
  if (data.report) dateSel.value = data.report.date;
  if (!data.dates.length) {
    contentEl.textContent = "";
    contentEl.append(el("div", "empty", "No reports yet. The first report appears after the first recorded care day."));
    return;
  }
  render(data.report);
}

dateSel.addEventListener("change", () => load(dateSel.value));
load();
</script>
</body>
</html>
